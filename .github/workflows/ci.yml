# The quality gate from maak.scm, run where maak itself is not installed.  The
# unit suite goes on the oldest Emacs the package claims and on the newest, so a
# function that arrived after 29.1 fails here and not in a user's editor.  The
# integration suite starts a real MPD and a real mpv; both play through a null
# output, so a runner with no sound card is enough.  Lint runs once, on the
# newest: a warning only an old byte-compiler emits is not a compatibility
# failure.

name: CI

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit suite on Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ["29.1", "31.1"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs ${{ matrix.emacs }}
        uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs }}

      - name: Byte-compile the package and its suites
        run: |
          emacs -Q --batch -L . -L test -f batch-byte-compile \
            orpheus-backend.el orpheus-playlist.el orpheus-transient.el \
            orpheus-equalizer.el orpheus-mpd.el \
            orpheus-local.el orpheus-ssh.el orpheus-ui.el orpheus-vis.el \
            orpheus.el test/orpheus-test.el test/orpheus-integration-test.el \
            test/orpheus-checkdoc.el

      - name: Run the unit suite
        run: |
          emacs -Q --batch -L . -L test -l test/orpheus-test.el \
            -f ert-run-tests-batch-and-exit

  integration:
    name: integration suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: 31.1

      # The suite skips itself when a program is missing; installing them is
      # what makes the job mean anything.
      - name: Install MPD, mpv and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mpd mpv ffmpeg

      - name: Run the integration suite
        run: |
          emacs -Q --batch -L . -L test -l test/orpheus-integration-test.el \
            -f ert-run-tests-batch-and-exit

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Emacs 31.1
        uses: purcell/setup-emacs@master
        with:
          version: 31.1

      - name: Byte-compile with warnings turned into errors
        run: |
          emacs -Q --batch -L . -L test \
            --eval "(setq byte-compile-error-on-warn t)" \
            -f batch-byte-compile \
            orpheus-backend.el orpheus-playlist.el orpheus-transient.el \
            orpheus-equalizer.el orpheus-mpd.el \
            orpheus-local.el orpheus-ssh.el orpheus-ui.el orpheus-vis.el \
            orpheus.el test/orpheus-test.el test/orpheus-integration-test.el \
            test/orpheus-checkdoc.el

      - name: Checkdoc
        run: emacs -Q --batch -L . -l test/orpheus-checkdoc.el
